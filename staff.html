<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>蜂翼智飞 · 工作人员端</title>
  <link rel="stylesheet" href="site.css">
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <span class="brand-mark"><i data-lucide="settings-2" aria-hidden="true"></i></span>
      <div>
        <div class="brand-name">蜂翼智飞</div>
        <div class="brand-sub">工作人员端</div>
      </div>
    </div>
    <div class="header-actions">
      <a class="btn header-btn" href="screen.html">
        <i data-lucide="monitor" aria-hidden="true"></i>指挥大屏
      </a>
      <button class="btn header-btn" data-map-config-open>
        <i data-lucide="map" aria-hidden="true"></i>地图配置
      </button>
      <span class="header-status" id="live-status">实时同步</span>
    </div>
  </header>

  <main class="main-wrap">
    <h1 class="page-title">订单处理</h1>
    <p class="page-sub">接收客户订单并完成调度、装载、飞行与交付</p>

    <div class="staff-layout">
      <section class="panel">
        <div class="panel-head">
          <span>订单列表</span>
          <div class="panel-head-actions">
            <span class="panel-meta" id="last-updated">更新于 --:--:--</span>
            <span class="badge teal" id="order-count">0</span>
          </div>
        </div>
        <div class="order-list" id="order-list"></div>
      </section>

      <section class="panel">
        <div class="panel-head"><span>任务详情</span></div>
        <div id="detail-body"></div>
      </section>
    </div>
  </main>

  <div class="modal-backdrop hidden" id="map-config-modal">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="map-config-title">
      <div class="modal-head">
        <div class="modal-title" id="map-config-title">高德地图配置</div>
        <button class="btn" data-map-config-close>关闭</button>
      </div>
      <div class="modal-body">
        <form id="map-config-form">
          <div class="form-grid">
            <div class="field full">
              <label for="amap-key">高德地图 Key</label>
              <input id="amap-key" name="amapKey" placeholder="请输入 JS API Key">
            </div>
            <div class="field full">
              <label for="security-code">安全密钥 SecurityJsCode</label>
              <input id="security-code" name="securityCode" placeholder="请输入安全密钥">
            </div>
          </div>
          <div class="form-actions">
            <button class="btn primary" type="submit">
              <i data-lucide="save" aria-hidden="true"></i>保存配置
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div class="toast-wrap" id="toast-wrap" aria-live="polite"></div>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.446.0/dist/umd/lucide.min.js"></script>
  <script src="store.js"></script>
  <script src="map.js"></script>
  <script src="staff.js"></script>
</body>
</html>
